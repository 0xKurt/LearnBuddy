# The core of the app on a real phone: she writes, Buddy answers, and what he
# did stands in the conversation as a card (issue #37).
# Needs a signed-in device — run 02-sign-in first, or sign in by hand.
appId: com.learnbuddy.app.dev
---
- launchApp:
    clearState: false
- assertVisible:
    id: 'composer'
    timeout: 20000

# What these flows prove, they prove by assertion: the run checks it itself,
# where a screenshot only waits for someone to look at it.

- tapOn:
    id: 'composer'
- inputText: 'Erklär mir bitte kurz, was ein Nenner ist'
- hideKeyboard
- tapOn:
    text: 'Senden'
# The model really answers here (hosted API): more room than a scripted turn.
- assertVisible:
    text: '.*Nenner.*'
    timeout: 45000
