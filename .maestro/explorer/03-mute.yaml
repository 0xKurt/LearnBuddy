appId: com.learnbuddy.app.dev
---
- stopApp
- launchApp:
    clearState: false
- runFlow:
    when:
      visible:
        text: Anhören
        checked: true
    commands:
      - tapOn: Anhören
- assertVisible:
    text: Anhören
    checked: false
- tapOn:
    id: composer
- inputText: 'Erklaer mir Brueche'
- tapOn: Senden
- extendedWaitUntil:
    visible:
      text: '.*Bruch.*'
    timeout: 30000
- assertVisible:
    text: Anhören
    checked: false
- stopApp
- launchApp:
    clearState: false
- assertVisible:
    text: Anhören
    checked: false
# Checked-state proof only; absence of audible output needs the separate audio recording gate.
