name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The API's integration tests run against a real Postgres (never mocked).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LB_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      LB_REQUIRE_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes solely from package.json `packageManager`
        # (pnpm@10.32.1). Specifying `version:` here too makes
        # pnpm/action-setup@v4 fail with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  deploy-check:
    name: deploy config (Vercel detector)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vercel's own builder detection on apps/api (audit H-35, S-9). The database and
      # /v1/health parts run where DATABASE_URL / LB_DEPLOY_URL are set (before promote).
      - run: scripts/deploy-check.sh

  web:
    name: browser walkthrough + fit (390×844, 360×740)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # CLAUDE.md rule 16: every screen fits both phones; tests/web/fit.ts fails otherwise.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LB_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      LB_REQUIRE_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Walkthrough (web build against the dev stack)
        run: scripts/web-walkthrough.sh
      - name: Keep screenshots and fit measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-walkthrough
          path: test-results/web
          if-no-files-found: ignore
