name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The browser walkthrough runs only when started by hand (Actions → CI → Run workflow):
  # it costs most of the CI minutes (owner, 03.10.). Locally it is `pnpm verify`.
  workflow_dispatch:

# A newer push to the same branch makes the older run worthless: cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The gates that look at the code: types, lint and the engineering guards, the app bundle, the
    # Ausnahmelisten, the fresh base, the starter kit. The tests run in their own jobs beside it
    # (test-api, test-app): together they took 9.5–12 of this job's 15 minutes.
    name: typecheck + lint + guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The guards' own tests read the test database's URL (tools/guards, #791).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LB_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      LB_REQUIRE_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # The Ausnahmelisten are measured on main (tools/guards/base.mjs, issue #452), and a
          # growth needs a reason in one of the PR's commits (tools/guards/no-growth.mjs, #313):
          # both need main's history next to the PR.
          fetch-depth: 0

      - name: Setup pnpm
        # Version comes solely from package.json `packageManager`
        # (pnpm@10.32.1). Specifying `version:` here too makes
        # pnpm/action-setup@v4 fail with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint + engineering guards
        # eslint (incl. file size, tokens only, raw Pressable) and `pnpm guards` (copies, dead
        # code, the guards' own tests), each against what main has — docs/engineering-guards.md.
        run: pnpm lint

      - name: App bundle + shipped licences
        # The iOS and Android export: it must bundle, carry no secret, and
        # apps/mobile/lib/licences.json must list exactly the packages in it, each under an
        # allowed licence (tools/guards/licences.mjs, issue #493).
        run: pnpm -F @learnbuddy/mobile bundle:check

      - name: Ausnahmelisten only shrink
        if: github.event_name == 'pull_request'
        run: node tools/guards/no-growth.mjs origin/${{ github.base_ref }}

      - name: Fresh base (no long branches)
        # A PR missing main commits older than a day is red: merge main while the conflict is
        # still small (Engineering-Regel 8, tools/guards/fresh-base.mjs, issue #328).
        if: github.event_name == 'pull_request'
        # The PR's own head, not the merge commit GitHub checks out (that contains main always).
        run: node tools/guards/fresh-base.mjs origin/${{ github.base_ref }} ${{ github.event.pull_request.head.sha }}

      - name: Starter kit (create-buddy → typecheck)
        # Every change here can break a new Buddy app (issue #107: the kit rotted once while
        # LearnBuddy moved on). The reference buddy is made from scratch, installed from the
        # store this job already filled, typechecked, and `provision --dry-run` runs in it. The
        # kit's own tests (pnpm test) already checked that the copy has no tie to this app's
        # infrastructure. A new app has no create-buddy of its own: there the step is skipped.
        if: hashFiles('packages/buddy-kit/src/cli/create-buddy.ts') != ''
        run: pnpm create-buddy "$RUNNER_TEMP/reference-buddy" --config packages/buddy-kit/reference.config.json --verify=typecheck

  test-api:
    # The API's tests, its integration tests against a real Postgres (never mocked) — most of
    # what `pnpm test` took (about 7 of its 8 minutes).
    name: test (API, real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LB_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      LB_REQUIRE_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm -F @learnbuddy/api test

  test-app:
    # Every other workspace's tests: the app (components and lib), the contracts, maths, the kit.
    name: test (app and packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm -r --parallel --filter '!@learnbuddy/api' test

  core:
    # The generic core by construction, without the learning domain (issue #107): copied,
    # installed and typechecked against packages/buddy-kit/core-gaps.json, its API booted, its
    # own database (packages/buddy-kit/core-baseline.sql) compared with what the migrations build
    # without the domain, and its tests run on that database. Its own job beside `check`: it
    # installs and tests a whole second copy, which `check` has no minutes left for.
    name: starter kit core (create-buddy --core, own database, core tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LB_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      LB_REQUIRE_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does the change reach the core?
        # Only what the core copy is made of, or what decides it: the kit, the API, the app's
        # code, the contracts, the guard's domain lists and the migrations. Everything on main.
        id: reach
        run: |
          # A Buddy made by the kit has no core check of its own (create.ts leaves it out).
          if [ ! -f packages/buddy-kit/src/cli/core-check.ts ]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }}" \
            | grep -qE '^(packages/buddy-kit/|apps/api/|apps/mobile/(app|components|lib)/|packages/shared-types/|tools/guards/boundaries\.config\.mjs$|infra/supabase/(migrations/|test-shim\.sql$)|\.github/workflows/check\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the core copy is made of changed: skipped."
          fi

      - name: Postgres 16 client (psql, pg_dump)
        # The baseline is compared with psql; `--write` needs a pg_dump of the server's major.
        if: steps.reach.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          echo "LB_PG_DUMP=/usr/lib/postgresql/16/bin/pg_dump" >> "$GITHUB_ENV"

      - name: Setup pnpm
        if: steps.reach.outputs.run == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.reach.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.reach.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Core check
        # A new type gap is red (the core reaches the domain again), and so is a closed one the
        # list still names; so is a baseline that is not the core's schema, a boot that refuses,
        # or a core test that fails on the core's own database.
        if: steps.reach.outputs.run == 'true'
        run: pnpm core-check

  deploy-check:
    name: deploy config (Vercel detector)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vercel's own builder detection on apps/api (audit H-35, S-9). The database and
      # /v1/health parts run where DATABASE_URL / LB_DEPLOY_URL are set (before promote).
      - run: scripts/deploy-check.sh

  web:
    name: browser walkthrough + fit (390×844, 360×740)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # CLAUDE.md rule 16: every screen fits both phones; tests/web/fit.ts fails otherwise.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LB_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      LB_REQUIRE_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Walkthrough (web build against the dev stack)
        run: scripts/web-walkthrough.sh
      - name: Walkthrough with a voice (Diktat)
        # The Diktat spec needs Buddy's voice, which the dev stack has only with a fake speech
        # provider — and core-loop asserts there is none, so it runs on its own stack (issue #334).
        # The web export from the step above is reused (same sources, same port).
        env:
          LB_DEV_SPEECH: fake
        run: scripts/web-walkthrough.sh dictation
      - name: Keep screenshots and fit measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-walkthrough
          path: test-results/web
          if-no-files-found: ignore
