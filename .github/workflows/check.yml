name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The browser walkthrough runs only when started by hand (Actions → CI → Run workflow):
  # it costs most of the CI minutes (owner, 03.10.). Locally it is `pnpm verify`.
  workflow_dispatch:

# A newer push to the same branch makes the older run worthless: cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The API's integration tests run against a real Postgres (never mocked).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LB_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      LB_REQUIRE_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # The Ausnahmelisten are measured on main (tools/guards/base.mjs, issue #452), and a
          # growth needs a reason in one of the PR's commits (tools/guards/no-growth.mjs, #313):
          # both need main's history next to the PR.
          fetch-depth: 0

      - name: Setup pnpm
        # Version comes solely from package.json `packageManager`
        # (pnpm@10.32.1). Specifying `version:` here too makes
        # pnpm/action-setup@v4 fail with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint + engineering guards
        # eslint (incl. file size, tokens only, raw Pressable) and `pnpm guards` (copies, dead
        # code, the guards' own tests), each against what main has — docs/engineering-guards.md.
        run: pnpm lint

      - name: App bundle + shipped licences
        # The iOS and Android export: it must bundle, carry no secret, and
        # apps/mobile/lib/licences.json must list exactly the packages in it, each under an
        # allowed licence (tools/guards/licences.mjs, issue #493).
        run: pnpm -F @learnbuddy/mobile bundle:check

      - name: Ausnahmelisten only shrink
        if: github.event_name == 'pull_request'
        run: node tools/guards/no-growth.mjs origin/${{ github.base_ref }}

      - name: Fresh base (no long branches)
        # A PR missing main commits older than a day is red: merge main while the conflict is
        # still small (Engineering-Regel 8, tools/guards/fresh-base.mjs, issue #328).
        if: github.event_name == 'pull_request'
        # The PR's own head, not the merge commit GitHub checks out (that contains main always).
        run: node tools/guards/fresh-base.mjs origin/${{ github.base_ref }} ${{ github.event.pull_request.head.sha }}

      - name: Test
        run: pnpm test

      - name: Starter kit (create-buddy → typecheck)
        # Every change here can break a new Buddy app (issue #107: the kit rotted once while
        # LearnBuddy moved on). The reference buddy is made from scratch, installed from the
        # store this job already filled, typechecked, and `provision --dry-run` runs in it. The
        # kit's own tests (pnpm test) already checked that the copy has no tie to this app's
        # infrastructure. A new app has no create-buddy of its own: there the step is skipped.
        if: hashFiles('packages/buddy-kit/src/cli/create-buddy.ts') != ''
        run: pnpm create-buddy "$RUNNER_TEMP/reference-buddy" --config packages/buddy-kit/reference.config.json --verify=typecheck

  deploy-check:
    name: deploy config (Vercel detector)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vercel's own builder detection on apps/api (audit H-35, S-9). The database and
      # /v1/health parts run where DATABASE_URL / LB_DEPLOY_URL are set (before promote).
      - run: scripts/deploy-check.sh

  web:
    name: browser walkthrough + fit (390×844, 360×740)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # CLAUDE.md rule 16: every screen fits both phones; tests/web/fit.ts fails otherwise.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LB_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      LB_REQUIRE_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Walkthrough (web build against the dev stack)
        run: scripts/web-walkthrough.sh
      - name: Walkthrough with a voice (Diktat)
        # The Diktat spec needs Buddy's voice, which the dev stack has only with a fake speech
        # provider — and core-loop asserts there is none, so it runs on its own stack (issue #334).
        # The web export from the step above is reused (same sources, same port).
        env:
          LB_DEV_SPEECH: fake
        run: scripts/web-walkthrough.sh dictation
      - name: Keep screenshots and fit measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-walkthrough
          path: test-results/web
          if-no-files-found: ignore
